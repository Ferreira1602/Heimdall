# =============================================================================
# Heimdall — VirtualHost Apache (mod_wsgi) com SSL
# Arquivo: /etc/apache2/sites-available/heimdall.conf
# Servidor: 10.250.128.114  ·  App em /var/www/heimdall  ·  venv em /var/www/heimdall/venv
# =============================================================================

# ---- HTTP (80): redireciona tudo para HTTPS ----
<VirtualHost *:80>
    ServerName 10.250.128.114
    RewriteEngine On
    RewriteRule ^/?(.*) https://%{HTTP_HOST}/$1 [R=301,L]
    ErrorLog ${APACHE_LOG_DIR}/heimdall_error.log
    CustomLog ${APACHE_LOG_DIR}/heimdall_access.log combined
</VirtualHost>

# ---- HTTPS (443): aplicação Heimdall ----
<VirtualHost *:443>
    ServerName 10.250.128.114

    SSLEngine on
    SSLCertificateFile      /etc/apache2/ssl/heimdall.crt
    SSLCertificateKeyFile   /etc/apache2/ssl/heimdall.key
    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          HIGH:!aNULL:!MD5
    SSLHonorCipherOrder     on

    # Cabeçalhos de segurança
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"

    # ---- WSGI ----
    # daemon mode isola a aplicação; o python-home aponta para o virtualenv.
    WSGIDaemonProcess heimdall \
        python-home=/var/www/heimdall/venv \
        python-path=/var/www/heimdall \
        processes=2 threads=15 display-name=%{GROUP}
    WSGIProcessGroup heimdall
    WSGIApplicationGroup %{GLOBAL}
    WSGIScriptAlias / /var/www/heimdall/wsgi.py
    # Necessário para que o header Authorization (Bearer da API) chegue ao Flask:
    WSGIPassAuthorization On

    <Directory /var/www/heimdall>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    # Servir estáticos diretamente pelo Apache (mais rápido que via WSGI)
    Alias /static /var/www/heimdall/app/static
    <Directory /var/www/heimdall/app/static>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/heimdall_error.log
    CustomLog ${APACHE_LOG_DIR}/heimdall_access.log combined
</VirtualHost>
