<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Heimdall</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/heimdall.css') }}">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="brand">
      {% include "_logo.svg" %}
      <span class="brand-name">HEIMDALL</span>
    </div>
    <div class="brand-tag">Sempre vigiando</div>

    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
    {% endwith %}

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-row">
        <label>E-mail</label>
        <input type="email" name="email" required autofocus placeholder="voce@empresa.com">
      </div>
      <div class="form-row">
        <label>Senha</label>
        <input type="password" name="password" required placeholder="••••••••">
      </div>
      <button class="btn" style="width:100%;justify-content:center;margin-top:6px;">Entrar</button>
    </form>
  </div>
</div>
</body>
</html>
